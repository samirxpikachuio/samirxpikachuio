name: Automated Commit

on:
  push:
    branches: [main]

  schedule:
    - cron: '*/5 * * * *' # consider running less frequently than every minute (example: every 5 minutes)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Debug Information
        run: echo "::debug::Triggered by ref = ${{ github.ref }}"

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Update Timestamp File
        run: |
          current_time=$(date '+%Y-%m-%d %H:%M:%S')
          echo "Updated on $current_time" > TIMESTAMP.txt

      - name: Setup Git Configuration
        run: |
          git config user.email "samirxpikachuio@gmail.com"
          git config user.name "samirxpikachuio"

      - name: Prepare Commit
        run: |
          commit_messages=("Update: ⏰" "Refresh: 🔄" "Renew: 🌟" "Revise: 📝" "Amend: 🛠" "Adjust: 🔧" "Change: 📈" "Modify: 🖊" "Transform: 🌀" "Revamp: 🌈")
          random_msg=${commit_messages[$RANDOM % ${#commit_messages[@]}]}

          git add TIMESTAMP.txt
          git commit -m "$random_msg - $current_time" || echo "No changes to commit."

      - name: Push changes (robust)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Configure authenticated remote
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          # Resolve branch name: prefer github.ref_name, fallback to master
          BRANCH_NAME="${{ github.ref_name || 'master' }}"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="master"
          fi

          # Fetch latest for that branch
          git fetch origin "$BRANCH_NAME" --depth=1 || true

          # If remote exists, attempt to rebase our commit(s) on top of it (to avoid non-fast-forward)
          if git rev-parse --verify origin/$BRANCH_NAME >/dev/null 2>&1; then
            # If there are local commits, rebase them on top of origin
            if [ -n "$(git rev-list --no-merges origin/$BRANCH_NAME..HEAD)" ]; then
              git rebase --autostash origin/$BRANCH_NAME || git pull --rebase origin $BRANCH_NAME || true
            fi
          fi

          # Push using --force-with-lease to handle race conditions safely
          git push origin HEAD:$BRANCH_NAME --force-with-lease
